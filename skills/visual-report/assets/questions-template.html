<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REPORT TITLE</title>
<style>
  /* ---- palette: one calm accent, tuned for light and dark ---- */
  :root {
    --bg: #fbfbfa;
    --surface: #ffffff;
    --surface-2: #f4f4f2;
    --ink: #1c1c1a;
    --ink-soft: #55554f;
    --ink-faint: #6b6b62;   /* 4.9:1 on --bg; do not lighten, captions use it */
    --line: #e5e5e0;
    --accent: #3b5bdb;
    --accent-soft: #edf0fd;
    --good: #2b8a3e;
    --warn: #d9480f;
    --radius: 12px;
    --maxw: 800px;    /* reading column: prose stays a comfortable measure */
    --wide: 1320px;   /* breakout cap: tables, card grids, diagrams, code */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16161a;
      --surface: #1e1e24;
      --surface-2: #26262e;
      --ink: #ececef;
      --ink-soft: #b4b4bd;
      --ink-faint: #90909b;
      --line: #33333d;
      --accent: #8098f9;
      --accent-soft: #232840;
      --good: #69db7c;
      --warn: #ff922b;
    }
  }
  * { box-sizing: border-box; }
  /* Base 18px (112.5% of the 16px default) so the report reads a notch larger
     without the reader zooming. Everything else is sized in rem/em off this
     root, so this one value scales the whole page; keep sizes relative. */
  html { -webkit-text-size-adjust: 100%; font-size: 112.5%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 1.05rem/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: clamp(20px, 5vw, 64px) 20px 120px;
  }
  .wrap { max-width: var(--maxw); margin: 0 auto; }

  /* Structural elements break out past the reading column to use a wide screen;
     prose stays narrow. Capped at --wide and clamped to the viewport, so it
     never causes sideways scroll. Centered with margins, not transform, so it
     still works one level deep, e.g. a table inside <details>. Add class
     "breakout" (or "wide") to opt an element in beyond the defaults below. */
  .breakout, .wide,
  main > .hero, main > .grid, main > .t-scroll, main > pre,
  main > details.section > .hero, main > details.section > .grid, main > details.section > .t-scroll, main > details.section > pre {
    width: min(var(--wide), 100vw - 40px);
    margin-left: calc(50% - min(var(--wide), 100vw - 40px) / 2);
    margin-right: calc(50% - min(var(--wide), 100vw - 40px) / 2);
  }

  /* Stacked dropdowns are one visual set, so their widths move together. When any
     top-level fold opts into the breakout, all of them follow, which keeps one
     wide fold from sitting among narrow neighbours with mismatched edges. */
  main:has(> details.breakout, > details.wide) > details:not(.section) {
    width: min(var(--wide), 100vw - 40px);
    margin-left: calc(50% - min(var(--wide), 100vw - 40px) / 2);
    margin-right: calc(50% - min(var(--wide), 100vw - 40px) / 2);
  }

  /* ---- opening ---- */
  .eyebrow { color: var(--accent); font-weight: 600; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; margin: 0 0 .6rem; }
  h1 { font-size: clamp(1.7rem, 4.5vw, 2.5rem); line-height: 1.15; letter-spacing: -.02em; margin: 0 0 .5rem; }
  .thesis { font-size: clamp(1.05rem, 2.4vw, 1.3rem); color: var(--ink-soft); line-height: 1.5; margin: 0 0 2rem; }

  /* Stat, for a figure that IS the finding ("38% of EU checkouts failed"), not one
     describing the work ("12 files reviewed"). .accent or .warn on the one
     carrying the weight. */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin: 1.4rem 0 2.2rem; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.1rem; }
  .stat .num { font-size: 1.9rem; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; }
  .stat .num.accent { color: var(--accent); }
  .stat .num.warn { color: var(--warn); }
  .stat .lbl { color: var(--ink-faint); font-size: .82rem; margin-top: .25rem; }

  /* ---- primary relationship ---- */
  .hero {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: clamp(18px, 4vw, 34px);
    margin-block: 0 2.4rem;
    overflow-x: auto;   /* only works if the svg is allowed to be wider than this box */
  }
  /* A diagram must SCROLL on a narrow screen, never shrink. max-width:100% alone
     silently scales a 900-wide viewBox to ~300px on a phone, dropping 12px labels
     to ~4px and making the most important element on the page unreadable. Set
     min-width to the diagram's natural width so the .hero scroll container engages. */
  .hero svg, .hero img { height: auto; display: block; margin: 0 auto; min-width: 640px; }
  @media (min-width: 800px) { .hero svg, .hero img { min-width: 0; max-width: 100%; } }
  figcaption { color: var(--ink-faint); font-size: .85rem; text-align: center; margin-top: .9rem; }

  h2 { font-size: 1.4rem; letter-spacing: -.01em; margin: 2.8rem 0 .3rem; padding-top: 1rem; }
  h3 { font-size: 1.08rem; margin: 1.8rem 0 .3rem; }
  .section-note { color: var(--ink-faint); font-size: .82rem; margin: 0 0 1rem; }
  p, li { color: var(--ink); }
  p { margin: 0 0 1rem; }
  a { color: var(--accent); }

  /* ---- callout: the one thing to remember ---- */
  .callout {
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 1rem 1.2rem;
    margin: 1.6rem 0;
  }
  .callout strong { color: var(--accent); }

  /* ---- cards / grid for parallel parts ---- */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin: 1.4rem 0; }
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 1.1rem 1.2rem;
  }
  .card h3 { margin-top: 0; }
  .card p { color: var(--ink-soft); font-size: .95rem; margin-bottom: 0; }

  /* ---- optional explanation ---- */
  details {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: .3rem 1.1rem;
    margin: 1rem 0;
    background: var(--surface);
  }
  details[open] { padding-bottom: 1rem; }
  summary { cursor: pointer; font-weight: 600; padding: .7rem 0; color: var(--ink); }
  summary::marker { color: var(--accent); }
  /* In a widened fold, hold running text at the reading measure rather than
     letting it stretch full width. Tables and other wide blocks keep the room. */
  details > p, details > ul, details > ol, details > blockquote { max-width: var(--maxw); }

  /* ---- section fold: a whole section the reader opens from its headline ----
     Closed, the page below the opening reads as a list of headlines. Open, the
     section reads as an ordinary part of the document: no card, full width, its
     own figures, grids, tables and detail folds, taking the space it needs. The
     summary is the section heading; do not nest an h2 inside it. */
  details.section { border: 0; border-top: 1px solid var(--line); border-radius: 0; background: none; padding: 0; margin: 0; }
  main > details.section:has(+ :not(details.section)), main > details.section:last-child { border-bottom: 1px solid var(--line); }
  details.section > summary { font-size: 1.4rem; font-weight: 700; letter-spacing: -.01em; line-height: 1.3; padding: 1.1rem 0; }
  details.section > summary::marker { font-size: .7em; }
  details.section[open] { padding-bottom: 1.8rem; }
  details.section[open] > summary { padding-bottom: .4rem; }
  details.section > p, details.section > ul, details.section > ol, details.section > blockquote { max-width: none; }
  details.section h3 { margin-top: 1.4rem; }
  details.section .hero { margin-block: 1rem 1.6rem; }
  details.section details { margin: 1rem 0; }

  /* Wrap tables in <div class="t-scroll"> rather than setting display:block on the
     table itself. display:block drops table layout, so the table shrink-wraps to
     its content and its borders stop mid-column. */
  .t-scroll { overflow-x: auto; margin: 1.3rem 0; }
  table { border-collapse: collapse; width: 100%; font-size: .95rem; }
  th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid var(--line); }
  th { color: var(--ink-faint); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }

  code { background: var(--surface-2); padding: .12em .4em; border-radius: 5px; font-size: .88em; font-family: ui-monospace, "SF Mono", Menlo, monospace; overflow-wrap: anywhere; }
  pre { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem 1.2rem; overflow-x: auto; }
  pre code { background: none; padding: 0; }

  /* svg diagram helpers. Style markers here, never with fill="var(--x)" as a
     presentation attribute: var() in presentation attributes is not reliably
     substituted, and the arrowheads fall back to black, invisible in dark mode. */
  .node { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
  .node-accent { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
  .edge { stroke: var(--ink-faint); stroke-width: 1.5; fill: none; }
  .arrowhead path { fill: var(--ink-faint); stroke: none; }
  .svg-lbl { fill: var(--ink); font: 13px -apple-system, sans-serif; }
  .svg-lbl-soft { fill: var(--ink-soft); font: 11px -apple-system, sans-serif; }

  hr { border: none; border-top: 1px solid var(--line); margin: 2.4rem 0; }
  .exit { background: var(--surface-2); border-radius: var(--radius); padding: 1.2rem 1.4rem; margin-top: 2rem; }
</style>
</head>
<body>
<main class="wrap">

  <p class="eyebrow">subject in familiar terms</p>
  <h1>the supported finding or central explanation</h1>
  <p class="thesis">one or two sentences that explain the title.</p>

  <!-- The opening: one or two .hero figures, a .stats row only for figures that are
       the finding, and the .callout when one line must be remembered. With every
       fold closed the page ends within two screens at 1280 by 900. -->

  <!-- Every later section is a section fold. Its summary is the headline that states
       the section's claim. Open, it reads as an ordinary section: prose, .grid cards,
       .hero figures, .t-scroll tables, and plain <details> detail folds for optional
       depth beside the answer they extend.

  <details class="section">
    <summary>headline that states this section's claim</summary>
    <p>the section, at the length it needs.</p>
    <details><summary>the question this optional detail answers</summary><p>optional depth.</p></details>
  </details>
  -->

  <!-- Construct the selected answers and their visuals from files/report-plan.md.
       No lens, section count, or ending is preselected here. -->

</main>
</body>
</html>
